[opcua]
enabled = true
host = "0.0.0.0"
port = 4840
timeout = 5
endpoint_path = "/conpot/server/"
server_name = "Conpot OPC UA Server"
namespace_uri = "http://conpot.org/OPCUA/"
application_uri = "urn:conpot:opcua"
opcua_root_path = "/data/opcua/"
add_src = ""
data_fs_subdir = "opcua"
max_file_size = 1048576

[[opcua.variables]]
name = "Temperature"
type = "float"
value = 25.0

[[opcua.variables]]
name = "Pressure"
type = "float"
value = 101.3

[[opcua.variables]]
name = "PumpRunning"
type = "boolean"
value = true

[[opcua.variables]]
name = "BatchId"
type = "integer"
value = 42

[[opcua.files]]
name = "firmware.bin"
content = "CONPOT_PLC_FW_V2.1.0"
writable = true
mime_type = "application/octet-stream"

[[opcua.files]]
name = "configuration.xml"
content = "<DeviceConfiguration><StationId>Plant-01</StationId></DeviceConfiguration>"
writable = true
mime_type = "text/xml"

