[snmp]
enabled = true
host = "0.0.0.0"
port = 16100
# Optional snmpEngineID (hex, 5..32 octets). When unset, Conpot derives a
# stable one from sysObjectID's enterprise number and never exposes the host
# name (PySNMP's own default does).
# engine_id = "800010e905a1b2c3d4e5f60718"

[[snmp.config]]
name = "tarpit"
command = "get"
value = "0.1;0.2"

[[snmp.config]]
name = "tarpit"
command = "set"
value = "0.1;0.2"

[[snmp.config]]
name = "tarpit"
command = "next"
value = "0.0;0.1"

[[snmp.config]]
name = "tarpit"
command = "bulk"
value = "0.2;0.4"

[[snmp.config]]
name = "evasion"
command = "get"
value = "120;240"

[[snmp.config]]
name = "evasion"
command = "set"
value = "120;240"

[[snmp.config]]
name = "evasion"
command = "next"
value = "240;600"

[[snmp.config]]
name = "evasion"
command = "bulk"
value = "120;240"

[[snmp.mibs]]
name = "SNMPv2-MIB"
symbols = [
    { "name" = "sysDescr", "value" = "SystemDescription" },
    { "name" = "sysObjectID", "value" = "sysObjectID" },
    { "name" = "sysUpTime", "value" = "Uptime" },
    { "name" = "sysContact", "value" = "sysContact" },
    { "name" = "sysName", "value" = "sysName" },
    { "name" = "sysLocation", "value" = "sysLocation" },
    { "name" = "sysServices", "value" = "sysServices" },
]
